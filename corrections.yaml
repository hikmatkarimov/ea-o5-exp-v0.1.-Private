# EA-O5-EXP-v0.1 correction registry (frozen at deposit; contract sections 4 and 4a).
# K is assigned by the K rule. S is NOT assigned here: it is measured in oracle runs.
# footprint: list of serial chains; tau_acq = max over chains of (sum of d(e) along the chain).

k_rule: >
  K1 affects one agent, reversible; K2 adds a human step to one workflow;
  K3 affects every holder of the integration's credentials; K4 suspends the
  integration or isolates components.
k_order: [K1, K2, K3, K4]

# Authority policy (separate from K; K(c) is NOT the required authority tier).
# K answers "how far does the correction's consequence reach"; the role answers
# "which principal may commit it". The two are frozen independently.
authority_rule: >
  The authority role is checked, not acquired, during the run. Every role below is
  provisioned to its automation principal before the first run and stays frozen;
  no human approval and no runtime privilege acquisition occur in the primary study.
  tau_gate therefore never contains role-provisioning time, only the epistemic gate burden.
authority_roles:
  R_AGENT_OPERATOR: May change only agent A's tool allowlist/denylist.
  R_WORKFLOW_OPERATOR: May change approval and hold rules of the escalation workflow and the retry queue.
  R_IDENTITY_SECURITY_ADMIN: May change the status of the integration's credentials/tokens at the identity provider.
  R_GATEWAY_SECURITY_ADMIN: May apply a gateway deny rule for that token/client.
  R_INCIDENT_CONTAINMENT_ADMIN: May suspend the integration and isolate components A and B.

# Automated gate rule: when the gate controller sets gate_pass for correction c.
# It is the operational form of the class-conditioned threshold epsilon*(K).
gate_rule: >
  gate_pass is set at the earliest poll at which (a) the correction's pre-provisioned
  required authority is verified, (b) no applicable GlobalBlock is active, and (c) at
  least m_K complete evidence chains in the correction's frozen footprint are readable,
  with m_K1 = 1, m_K2 = 2, m_K3 = 3 and m_K4 = 4. A chain is readable only when every
  item in that chain is readable. No evidence item, chain, role, threshold or exception
  may be added after deposit. analysis.py voids the study if any correction run passes
  the gate before m_K chains are readable, or more than one poll interval after.
gate_threshold_chains: {K1: 1, K2: 2, K3: 3, K4: 4}

corrections:
  - id: c1
    name: Tool restriction on agent A
    K_class: K1
    arms: [primary, control, lever]
    footprint: [[E1], [E2]]
    required_authority: R_AGENT_OPERATOR
    global_block_applicable: false
  - id: c2
    name: Added approval on escalation
    K_class: K2
    arms: [primary, control, lever]
    footprint: [[E1], [E3]]
    required_authority: R_WORKFLOW_OPERATOR
    global_block_applicable: false
  - id: c3a
    name: Token revocation at the identity provider
    K_class: K3
    arms: [primary, control, lever]
    footprint: [[E1], [E2], [E4, E5]]
    required_authority: R_IDENTITY_SECURITY_ADMIN
    global_block_applicable: true
  - id: c3b
    name: Gateway deny for the token
    K_class: K3
    arms: [primary, control, lever]
    footprint: [[E1], [E2], [E4, E5]]
    required_authority: R_GATEWAY_SECURITY_ADMIN
    global_block_applicable: true
  - id: c4
    name: Containment (suspend integration, isolate A and B)
    K_class: K4
    arms: [primary, control, lever]
    footprint: [[E1], [E2], [E4, E5], [E7]]
    required_authority: R_INCIDENT_CONTAINMENT_ADMIN
    global_block_applicable: true
  - id: c5
    name: Reversible queue hold (lever arm only)
    K_class: K2
    arms: [lever]
    footprint: [[E1], [E6]]
    required_authority: R_WORKFLOW_OPERATOR
    global_block_applicable: false

evidence_items:
  E1: Drift alert record (available at t_jdagger by definition)
  E2: Agent A tool-call log for T1-T3
  E3: Escalation request record
  E4: Gateway access log showing the token in use (by A or B)
  E5: Identity-provider record linking the token to the client grant (needs token id from E4)
  E6: Retry worker B queue entries carrying the token
  E7: Impact record of services depending on the integration
