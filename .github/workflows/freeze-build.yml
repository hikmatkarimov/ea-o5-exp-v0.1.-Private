# EA-O5-EXP-v0.1 freeze build (README_FREEZE.md, freeze procedure steps 1-3).
# Input: EA-O5-EXP-v0.1.zip committed at the repository root (the pre-build package).
# Runs on a GitHub-hosted Linux runner with Maven Central access. Start it by hand:
# Actions -> "EA-O5 freeze build" -> Run workflow. The result is a downloadable artifact
# EA-O5-EXP-v0.1-FROZEN (the final zip to deposit). Nothing is pushed back to the repository.
name: EA-O5 freeze build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: pkg/EA-O5-EXP-v0.1
    steps:
      - uses: actions/checkout@v4

      - name: Unpack the pre-build package
        working-directory: .
        run: |
          sha256sum EA-O5-EXP-v0.1.zip
          mkdir pkg && unzip -q EA-O5-EXP-v0.1.zip -d pkg
          ls pkg/EA-O5-EXP-v0.1

      - name: 0. Input package matches its pre-build MANIFEST
        run: sha256sum -c MANIFEST.sha256 && echo "pre-build MANIFEST OK"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Toolchain
        run: |
          java -version
          mvn -v
          python3 --version

      - name: 1. Build verifier (tests, two reproducible builds, lock, build record)
        run: bash verifier/build_and_lock.sh

      - name: Show build record
        run: cat verifier/BUILD_RECORD.json

      - name: 2. Freeze switch and full test suite
        run: |
          pip install pyyaml jsonschema
          sed -i 's/^EXPECT_FROZEN = False/EXPECT_FROZEN = True/' test_analysis.py
          python3 -m unittest -v test_analysis.py

      - name: 3. Final MANIFEST.sha256
        run: |
          rm -rf verifier/target __pycache__
          find . -type f ! -name MANIFEST.sha256 -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > MANIFEST.sha256
          sha256sum -c --quiet MANIFEST.sha256 && echo "MANIFEST OK: $(wc -l < MANIFEST.sha256) files"

      - name: Final zip
        working-directory: pkg
        run: |
          zip -qr EA-O5-EXP-v0.1-FROZEN.zip EA-O5-EXP-v0.1
          sha256sum EA-O5-EXP-v0.1-FROZEN.zip | tee EA-O5-EXP-v0.1-FROZEN.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: EA-O5-EXP-v0.1-FROZEN
          path: |
            pkg/EA-O5-EXP-v0.1-FROZEN.zip
            pkg/EA-O5-EXP-v0.1-FROZEN.zip.sha256
          if-no-files-found: error
